[project]
name = "py-net-conf-cisco"
version = "0.1.0"
description = "Python package for working with Cisco network device configurations."
readme = "README.md"
authors = [
    { name = "Troy Holder", email = "964446+troyholder@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = ["ciscoconfparse2>=0.8.20"]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--cov=py_net_conf_cisco",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
